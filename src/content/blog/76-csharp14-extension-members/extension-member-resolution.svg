<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="460" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#111111">C# 14 Extension Member Resolution</text>
  <text x="40" y="70" font-size="14" fill="#666666">What the compiler checks, in order, for order.IsEligibleForFreeShipping</text>

  <!-- Row 1 -->
  <rect x="40" y="100" width="230" height="64" rx="10" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.2"/>
  <text x="155" y="126" font-size="14" font-weight="700" fill="#111111" text-anchor="middle">Call site</text>
  <text x="155" y="146" font-size="11" fill="#555555" text-anchor="middle" font-family="Menlo, Consolas, monospace">order.IsEligibleFor-</text>
  <text x="155" y="158" font-size="11" fill="#555555" text-anchor="middle" font-family="Menlo, Consolas, monospace">FreeShipping</text>

  <rect x="320" y="100" width="230" height="64" rx="10" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <text x="435" y="126" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Real member declared</text>
  <text x="435" y="144" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">on Order itself?</text>

  <rect x="600" y="100" width="230" height="64" rx="10" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <text x="715" y="126" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Extension blocks in scope</text>
  <text x="715" y="144" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">declaring this name</text>

  <!-- Row 1 arrows -->
  <line x1="270" y1="132" x2="312" y2="132" stroke="#111111" stroke-width="2"/>
  <polygon points="320,132 308,126 308,138" fill="#111111"/>

  <line x1="550" y1="132" x2="567" y2="132" stroke="#111111" stroke-width="2"/>
  <text x="559" y="123" font-size="11" font-weight="700" fill="#555555" text-anchor="middle">no</text>
  <polygon points="600,132 588,126 588,138" fill="#111111"/>

  <!-- YES branch down from decision 1 -->
  <line x1="435" y1="164" x2="435" y2="200" stroke="#111111" stroke-width="2"/>
  <text x="452" y="186" font-size="11" font-weight="700" fill="#555555">yes</text>
  <polygon points="435,208 429,196 441,196" fill="#111111"/>

  <rect x="320" y="208" width="230" height="78" rx="10" fill="#000000" fill-opacity="0.08" stroke="#000000" stroke-opacity="0.45"/>
  <text x="435" y="232" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Real member wins.</text>
  <text x="435" y="250" font-size="11" fill="#333333" text-anchor="middle">Always. Zero compiler warning —</text>
  <text x="435" y="265" font-size="11" fill="#333333" text-anchor="middle">even when an extension member</text>
  <text x="435" y="280" font-size="11" fill="#333333" text-anchor="middle">matches the same name.</text>

  <!-- From decision 2: two branches -->
  <line x1="660" y1="164" x2="660" y2="200" stroke="#111111" stroke-width="2"/>
  <text x="608" y="186" font-size="11" font-weight="700" fill="#555555">exactly 1 match</text>
  <polygon points="660,208 654,196 666,196" fill="#111111"/>

  <rect x="600" y="208" width="230" height="64" rx="10" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.2"/>
  <text x="715" y="234" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">Use that extension</text>
  <text x="715" y="252" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">member</text>

  <line x1="770" y1="132" x2="900" y2="132" stroke="#111111" stroke-width="2"/>
  <line x1="900" y1="132" x2="900" y2="200" stroke="#111111" stroke-width="2"/>
  <text x="915" y="170" font-size="11" font-weight="700" fill="#555555">2+ matches</text>
  <polygon points="900,208 894,196 906,196" fill="#111111"/>

  <rect x="880" y="208" width="240" height="78" rx="10" fill="#000000" fill-opacity="0.08" stroke="#000000" stroke-opacity="0.45"/>
  <text x="1000" y="232" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">CS9339</text>
  <text x="1000" y="250" font-size="11" fill="#333333" text-anchor="middle">Ambiguous extension</text>
  <text x="1000" y="265" font-size="11" fill="#333333" text-anchor="middle">resolution — compile</text>
  <text x="1000" y="280" font-size="11" fill="#333333" text-anchor="middle">error, every time.</text>

  <!-- Independent rule -->
  <rect x="40" y="340" width="1120" height="92" rx="10" fill="#000000" fill-opacity="0.03" stroke="#000000" stroke-opacity="0.25" stroke-dasharray="2 3"/>
  <text x="64" y="366" font-size="12" font-weight="700" fill="#111111">Independent of the flow above, at any point:</text>
  <text x="64" y="388" font-size="12" fill="#333333" font-family="Menlo, Consolas, monospace">An extension property referenced inside Expression&lt;Func&lt;T,...&gt;&gt; (what EF Core's Where(...) compiles a predicate into)</text>
  <text x="64" y="408" font-size="12" fill="#333333">fails with <tspan font-weight="700" font-family="Menlo, Consolas, monospace">CS9296</tspan> — a compile-time error, not a runtime EF Core translation failure.</text>
</svg>
